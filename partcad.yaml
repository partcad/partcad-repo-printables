# PartCAD package: Printables models as parts, served by a repository plugin.
#
# Published as //pub/universe/printables/models: this package is
# //pub/universe/printables, and its one external dependency 'models' is served by
# the printables_repo plugin. Nothing is listed - a model site's catalog is not
# something to enumerate - so a part is asked for by name, and found with
# 'pc search parts' (see the README).
name: //pub/universe/printables

desc: |
  Models on Printables (https://www.printables.com) as PartCAD parts, a part per
  file of a model, by the model's number. Nothing is listed: a part is asked for
  by name, and found with 'pc search parts'. No geometry is vendored; every file
  is fetched from Printables when it is first built.
url: https://www.printables.com/

# The first PartCAD with 'pc login', which runs the plugin's 'login' to pick a
# paid model's buyer's token up from their browser. Its repository plugins may
# also search their own catalog ('searchKinds') and resolve a parametrized name
# themselves ('instanceKinds'), which is what lets a parameter choose another
# file of a model.
partcad: ">=0.9.3"

# An upload to a model site says nothing about whether, or how, it is made to
# be manufactured. The plugin says the same of 'models' in its metadata.
manufacturable: false

docs:
  name: Printables for PartCAD
  usage: |
    ```shell
    pc search parts -P //pub/universe/printables/models -k "cable clip"
    pc inspect //pub/universe/printables/models:271731
    pc inspect "//pub/universe/printables/models:271731;format=stl"
    pc login //pub/universe/printables:printables_repo
    ```

dependencies:
  models:
    type: external
    plugin: :printables_repo
    desc: Printables models, a part per file.

repositories:
  printables_repo:
    type: basic
    path: printables_repo.py
    desc: Serves Printables models as parts, searches Printables, and logs in to it.
    parameters:
      # Empty here, and meant to stay so. A credential is the user's own, and
      # is set where only they see it - 'pc login' saves it in the user's own
      # configuration; the plugin reads the environment when this is empty.
      token:
        type: string
        default: ""
        desc: >-
          The access token of a signed-in Printables (Prusa Account) user: the
          'auth.access_token' cookie of printables.com. Only a paid model's files
          need one, and only that model's buyer's. 'pc login
          //pub/universe/printables:printables_repo' picks it up from the
          browser and saves it in your own ~/.partcad/config.yaml; or give it as
          the PRINTABLES_TOKEN environment variable - never in a package. It is
          short-lived.
